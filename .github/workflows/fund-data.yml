name: Fund data refresh

on:
  workflow_dispatch:
  schedule:
    # China trading-day checkpoint in UTC: 14:10 Asia/Shanghai.
    - cron: '10 6 * * 1-5'
    # China trading-day checkpoint in UTC: 16:00 Asia/Shanghai.
    - cron: '0 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: fund-data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: master
      DATA_FILES: data/latest.json data/history.json data/refresh-snapshots.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify
        run: npm test

      - name: Update fund data
        run: npm run update

      - name: Commit generated data
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Retrying data refresh publish, attempt $attempt/3."
              git fetch origin "$TARGET_BRANCH"
              git reset --hard "origin/$TARGET_BRANCH"
              npm run update
            fi

            if git diff --quiet -- $DATA_FILES; then
              echo "No data changes to commit."
              exit 0
            fi

            git add $DATA_FILES
            git commit -m "data: update fund snapshots"

            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Data refresh published to $TARGET_BRANCH."
              exit 0
            fi

            echo "Push failed; syncing latest $TARGET_BRANCH before retry."
          done

          echo "Failed to publish data refresh after 3 attempts." >&2
          exit 1
