name: Fund data refresh

on:
  workflow_dispatch:
  schedule:
    # Start before 14:30 SGT, then wait inside the job because GitHub cron can be delayed.
    - cron: '10 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: fund-data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: master
      DATA_FILES: data/latest.json data/history.json data/refresh-snapshots.json
      REFRESH_TIMEZONE: Asia/Singapore
      REFRESH_TARGET_TIME: "14:30"
      REFRESH_CUTOFF_TIME: "15:05"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plan refresh window
        id: refresh-window
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(TZ="$REFRESH_TIMEZONE" date +%F)"
          target_epoch="$(TZ="$REFRESH_TIMEZONE" date -d "$today $REFRESH_TARGET_TIME:00" +%s)"
          cutoff_epoch="$(TZ="$REFRESH_TIMEZONE" date -d "$today $REFRESH_CUTOFF_TIME:00" +%s)"
          now_epoch="$(date -u +%s)"

          if [ "$now_epoch" -lt "$target_epoch" ]; then
            sleep_seconds=$((target_epoch - now_epoch))
            echo "Waiting $sleep_seconds seconds until $REFRESH_TARGET_TIME $REFRESH_TIMEZONE."
            sleep "$sleep_seconds"
            now_epoch="$(date -u +%s)"
          fi

          if [ "$now_epoch" -gt "$cutoff_epoch" ]; then
            echo "Scheduled run started after $REFRESH_CUTOFF_TIME $REFRESH_TIMEZONE; skipping late data refresh."
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          already_published="$(
            TARGET_EPOCH="$target_epoch" node -e "
              const fs = require('fs');
              const targetEpoch = Number(process.env.TARGET_EPOCH);
              let latest = {};
              try {
                latest = JSON.parse(fs.readFileSync('data/latest.json', 'utf8'));
              } catch {}
              const generatedAt = latest.generatedAt;
              const generatedEpoch = generatedAt ? Math.floor(new Date(generatedAt).getTime() / 1000) : 0;
              console.log(generatedEpoch >= targetEpoch ? 'true' : 'false');
            "
          )"

          if [ "$already_published" = "true" ]; then
            echo "Today's scheduled refresh has already been published."
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_update=true" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.refresh-window.outputs.should_update == 'true'
        run: npm test

      - name: Update fund data
        if: steps.refresh-window.outputs.should_update == 'true'
        run: npm run update

      - name: Commit generated data
        if: steps.refresh-window.outputs.should_update == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Retrying data refresh publish, attempt $attempt/3."
              git fetch origin "$TARGET_BRANCH"
              git reset --hard "origin/$TARGET_BRANCH"
              npm run update
            fi

            if git diff --quiet -- $DATA_FILES; then
              echo "No data changes to commit."
              exit 0
            fi

            git add $DATA_FILES
            git commit -m "data: update fund snapshots"

            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Data refresh published to $TARGET_BRANCH."
              exit 0
            fi

            echo "Push failed; syncing latest $TARGET_BRANCH before retry."
          done

          echo "Failed to publish data refresh after 3 attempts." >&2
          exit 1
